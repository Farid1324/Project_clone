name: Marketplace checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: marketplace
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start isolated PostgreSQL with generated credentials
        working-directory: .
        env:
          DB_DATABASE: marketplace_testing
        run: sh scripts/start-ci-database.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, dom, xml, xmlwriter, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: php artisan test --compact
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix ../frontend
      - run: node --test scripts/check-submission-secrets.test.mjs scripts/export-ai-chat.test.mjs
        working-directory: .
      - run: node scripts/check-submission-secrets.mjs
        working-directory: .
      - run: npm run lint --prefix ../frontend
      - run: npm run typecheck --prefix ../frontend
      - run: npm run build --prefix ../frontend
      - run: npm audit --omit=dev --prefix ../frontend
      - run: composer audit --locked --no-dev
      - name: Start the compiled single-origin demo
        env:
          APP_ENV: local
          DB_DATABASE: marketplace
          CACHE_STORE: array
          BCRYPT_ROUNDS: 4
        run: |
          docker exec marketplace-postgres createdb -U marketplace marketplace
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan marketplace:inventory-secret --no-interaction
          php artisan migrate --no-interaction
          php artisan db:seed --no-interaction
          cp -R ../frontend/dist/. public/
          cd public
          php -d opcache.enable_cli=1 -S 127.0.0.1:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > /tmp/keymarket-qa.log 2>&1 &
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser regression against the compiled app
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e --prefix ../frontend
  production-image:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: marketplace
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start isolated PostgreSQL with generated credentials
        env:
          DB_DATABASE: marketplace
        run: sh scripts/start-ci-database.sh
      - run: docker build --tag keymarket:ci .
      - name: Start production image with isolated CI fixtures
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          KEY_FINGERPRINT_SECRET="$(openssl rand -hex 32)"
          export APP_KEY KEY_FINGERPRINT_SECRET
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$KEY_FINGERPRINT_SECRET"
          docker run --detach --name marketplace-app --network host \
            -e APP_ENV=production -e APP_DEBUG=false -e APP_URL=https://demo.example.invalid \
            -e APP_KEY -e KEY_FINGERPRINT_SECRET \
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE=marketplace -e DB_USERNAME=marketplace -e DB_PASSWORD \
            -e DB_SSLMODE=disable -e SESSION_DRIVER=database -e SESSION_ENCRYPT=true \
            -e CACHE_STORE=database -e ALLOW_DEMO_SEEDING=true -e SEED_DEMO_ON_FIRST_BOOT=true \
            -e QUEUE_CONNECTION=sync -e BOOST_ENABLED=false keymarket:ci
      - name: Verify startup, deep links, API and missing assets
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:10000/api/v1/health
          curl --fail --silent http://127.0.0.1:10000/store | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:10000/api/v1/products | grep -q 'cover_image_url'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:10000/assets/missing.js)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:10000/api/v1/checkout/quote)" = 401
      - name: Container diagnostics
        if: failure()
        run: docker logs marketplace-app
